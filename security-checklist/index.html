<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>취약점 진단 평가</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="no-print">
  <h1>취약점 진단 평가</h1>
  <p>점검 기준을 기준판으로 등록하고, 자산별로 판정해 [붙임4] 산식으로 점수를 내고, 취약 항목의 조치를 관리합니다.</p>
</header>
<main>
  <nav class="no-print" aria-label="화면">
    <button data-tab="assess" aria-selected="true">진단 평가</button>
    <button data-tab="actions" aria-selected="false">조치 관리</button>
    <button data-tab="report" aria-selected="false">보고서</button>
    <button data-tab="criteria" aria-selected="false">기준판</button>
    <button data-tab="assets" aria-selected="false">자산·주기</button>
    <button data-tab="backup" aria-selected="false">백업·설정</button>
  </nav>
  <output id="message" role="status" class="no-print"></output>

  <div id="tab-assess" data-panel="assess"></div>
  <div id="tab-actions" data-panel="actions" hidden></div>
  <div id="tab-report" data-panel="report" hidden></div>
  <div id="tab-criteria" data-panel="criteria" hidden></div>
  <div id="tab-assets" data-panel="assets" hidden></div>
  <div id="tab-backup" data-panel="backup" hidden></div>
</main>

<!-- file:// 로 직접 열어도 동작하도록 ES 모듈 대신 일반 스크립트를 순서대로 불러옵니다. -->
<script src="js/data/rules.js"></script>
<script src="js/data/initial-criteria.js"></script>
<script src="js/lib/dates.js"></script>
<script src="js/lib/zip.js"></script>
<script src="js/lib/xlsx.js"></script>
<script src="js/import/documents.js"></script>
<script src="js/criteria.js"></script>
<script src="js/scoring.js"></script>
<script src="js/assessment.js"></script>
<script src="js/schema.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/assess-view.js"></script>
<script src="js/ui/actions-view.js"></script>
<script src="js/ui/report-view.js"></script>
<script src="js/ui/criteria-view.js"></script>
<script src="js/ui/assets-view.js"></script>
<script src="js/ui/backup-view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
